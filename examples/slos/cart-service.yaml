apiVersion: sloforge/v1
service: cart-service
owner: team-checkout
tier: critical
description: "Shopping cart reads and writes."
slos:
  - name: availability
    objective: 99.9
    window: 30d
    description: Share of requests that do not return a 5xx.
    sli:
      type: availability
      metric: http_requests_total
      labels: {job: cart-service}
      bad: {code: "5.."}
  - name: latency
    objective: 99.5
    window: 30d
    description: Share of requests served in under 0.2 s.
    sli:
      type: latency
      metric: http_request_duration_seconds
      labels: {job: cart-service}
      threshold_seconds: 0.2
