apiVersion: sloforge/v1
service: shipping-quotes
owner: team-fulfillment
tier: standard
description: "Carrier rate quotes at checkout."
slos:
  - name: availability
    objective: 99.5
    window: 30d
    description: Share of requests that do not return a 5xx.
    sli:
      type: availability
      metric: http_requests_total
      labels: {job: shipping-quotes}
      bad: {code: "5.."}
