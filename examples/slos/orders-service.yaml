apiVersion: sloforge/v1
service: orders-service
owner: team-fulfillment
tier: critical
description: "Order records and status."
slos:
  - name: availability
    objective: 99.9
    window: 30d
    description: Share of requests that do not return a 5xx.
    sli:
      type: availability
      metric: http_requests_total
      labels: {job: orders-service}
      bad: {code: "5.."}
