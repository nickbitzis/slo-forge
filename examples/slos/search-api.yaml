apiVersion: sloforge/v1
service: search-api
owner: team-discovery
tier: standard
description: "Product search and autocomplete."
slos:
  - name: availability
    objective: 99.5
    window: 30d
    description: Share of requests that do not return a 5xx.
    sli:
      type: availability
      metric: http_requests_total
      labels: {job: search-api}
      bad: {code: "5.."}
  - name: latency
    objective: 95.0
    window: 30d
    description: Share of requests served in under 0.8 s.
    sli:
      type: latency
      metric: http_request_duration_seconds
      labels: {job: search-api}
      threshold_seconds: 0.8
