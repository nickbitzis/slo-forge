apiVersion: sloforge/v1
service: catalog-api
owner: team-catalog
tier: standard
description: "Product details and category listings."
slos:
  - name: availability
    objective: 99.9
    window: 30d
    description: Share of requests that do not return a 5xx.
    sli:
      type: availability
      metric: http_requests_total
      labels: {job: catalog-api}
      bad: {code: "5.."}
  - name: latency
    objective: 99.0
    window: 28d
    description: Share of requests served in under 0.3 s.
    sli:
      type: latency
      metric: http_request_duration_seconds
      labels: {job: catalog-api}
      threshold_seconds: 0.3
